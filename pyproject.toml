[project]
name = "hass-nerdminer"
version = "0.2.0"
description = "Home Assistant integration for NerdMiner V2 via Public-Pool API"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Hudson Brendon", email = "contato.hudsonbrendon@gmail.com" }]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "pytest-homeassistant-custom-component>=0.13.150",
    "homeassistant>=2024.6.0",
    "ruff>=0.4",
    "mypy>=1.10",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "A", "C4", "RET", "SIM", "ARG"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
